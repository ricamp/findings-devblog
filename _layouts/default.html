<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 180 }}">

<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 180 }}">
<meta property="og:site_name" content="{{ site.title }}">

<!-- Carimbo de build nos assets. Sem ele o navegador de quem ja visitou o site
     serve o CSS e o JS antigos depois do deploy, e uma correcao publicada
     simplesmente nao chega — aconteceu aqui em desenvolvimento. site.time muda
     a cada build, entao a URL so muda quando ha build novo. -->
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ '/assets/ascii-fx.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ '/assets/eggs.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ '/assets/threshold.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

<script>
  /* Tema antes da pintura, para nao piscar branco no escuro. */
  (function () {
    var g = localStorage.getItem('findings-tema');
    var escuro = g ? g === 'escuro'
                   : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (escuro) document.documentElement.setAttribute('data-tema', 'escuro');
  })();
</script>
</head>
<body>

<header class="topo fx-hospede">
  <pre class="fx-camada" data-fx="sorteio" aria-hidden="true"></pre>
  <div class="topo-interno">
    <a class="marca" href="{{ '/' | relative_url }}" data-fx-scramble>findings/devblog</a>
    <!-- A legenda vem do _config. Ela ja esteve escrita aqui e la ao mesmo tempo:
         batiam por acaso, e a primeira edicao em um dos dois lados as separaria
         sem aviso — o topo diria uma coisa e a home outra. -->
    <span class="topo-tag">{{ site.tagline }}</span>
    <!-- O site inteiro e' em ingles (lang=en). O rotulo e o aria-label estavam em
         portugues: quem usa leitor de tela ouvia uma frase em outra lingua no meio
         da leitura. Nomes de classe e comentarios continuam em portugues — esses
         nao chegam ao leitor. -->
    <button class="tema-btn" id="tema-btn" type="button"
            aria-label="Toggle light and dark theme">theme · t</button>
  </div>
</header>

<main class="envelope">
  {{ content }}
</main>

<footer class="rodape">
  <p>
    {{ site.title }} — a research and portfolio project.<br>
    Not a medical device. Not cleared by any regulator.
  </p>
  <p>
    <a href="{{ '/models/' | relative_url }}">Models</a> ·
    <a href="{{ '/feed.xml' | relative_url }}">Atom feed</a>
  </p>
</footer>

<script>
  (function () {
    /* Tabela de metricas e' o conteudo tipico daqui e a que mais estoura em
       tela estreita. O kramdown gera <table> puro, entao a moldura de rolagem
       tem que ser posta depois — sem isso a pagina inteira rola de lado. */
    var tabelas = document.querySelectorAll('.prosa table');
    for (var i = 0; i < tabelas.length; i++) {
      var t = tabelas[i];
      if (t.parentNode.classList.contains('tabela-rolagem')) continue;
      var moldura = document.createElement('div');
      moldura.className = 'tabela-rolagem';
      moldura.setAttribute('tabindex', '0');
      t.parentNode.insertBefore(moldura, t);
      moldura.appendChild(t);
    }
  })();

  (function () {
    var raiz = document.documentElement;
    var btn = document.getElementById('tema-btn');

    function alterna() {
      var escuro = raiz.getAttribute('data-tema') === 'escuro';
      if (escuro) raiz.removeAttribute('data-tema');
      else raiz.setAttribute('data-tema', 'escuro');
      localStorage.setItem('findings-tema', escuro ? 'claro' : 'escuro');
    }

    btn.addEventListener('click', alterna);

    document.addEventListener('keydown', function (e) {
      if (e.key !== 't' && e.key !== 'T') return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var alvo = e.target.tagName;
      if (alvo === 'INPUT' || alvo === 'TEXTAREA' || e.target.isContentEditable) return;
      alterna();
    });
  })();
</script>

<script src="{{ '/assets/ascii-fx.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
<script src="{{ '/assets/threshold.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
<script src="{{ '/assets/eggs.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>

</body>
</html>
