title: "Findings — devblog"
# Findings e' o projeto, nao um modelo. Damoiseau (torax) foi o primeiro; os
# textos de nivel de site falam do projeto para nao precisarem de edicao a cada
# modelo novo. Os posts continuam nomeando o modelo de que tratam.
tagline: "Training AI vision models in public, one measured result at a time."
description: >-
  Public record of building Findings — training AI vision models for medical
  imaging, including the runs that came out wrong.
lang: en

url: "https://ricamp.github.io"
baseurl: "/findings-devblog"

permalink: /:year/:month/:day/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# jekyll-feed e' um dos plugins que o GitHub Pages ja traz — nao precisa build local.
plugins:
  - jekyll-feed

feed:
  path: feed.xml

sass:
  style: compressed

# O Jekyll deixa de fora todo arquivo que comeca com "_"; o motor do
# findings-marca tem um (efeitos/_comum.mjs) e sem ele nenhum efeito carrega.
include:
  - assets/marca/efeitos/_comum.mjs

# Versao C: o Liquid le modelos.json direto da copia do motor (site.data.modelos),
# para a margem animada usar a assinatura de cada modelo sem duplicar a tabela.
# So .json/.yml/.csv dessa pasta viram dados; o resto continua sendo arquivo estatico.
data_dir: assets/marca

exclude:
  - README.md
  - REVISAR.md
  - Gemfile
  - Gemfile.lock
  - vendor
