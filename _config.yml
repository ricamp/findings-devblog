title: "Findings — devblog"
# Findings e' o projeto, nao um modelo. Damoiseau (torax) foi o primeiro; os
# textos de nivel de site falam do projeto para nao precisarem de edicao a cada
# modelo novo. Os posts continuam nomeando o modelo de que tratam.
tagline: "Training AI vision models in public, one measured result at a time."
description: >-
  Public record of building Findings — training AI vision models for medical
  imaging, including the runs that came out wrong.
lang: en

url: "https://ricamp.github.io"
baseurl: "/findings-devblog"

permalink: /:year/:month/:day/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# jekyll-feed e' um dos plugins que o GitHub Pages ja traz — nao precisa build local.
plugins:
  - jekyll-feed

feed:
  path: feed.xml

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
